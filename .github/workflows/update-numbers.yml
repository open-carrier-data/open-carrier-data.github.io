name: Update the status numbers

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  actions: write

concurrency:
  group: update-numbers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the site
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: true

      - name: Checkout the public data
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: open-carrier-data/open-carrier-data
          path: public
          persist-credentials: false

      - name: Rewrite the numbers from the public checkout
        id: rewrite
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 tools/update_numbers.py public "$(date -u +%F)" "$(git -C public rev-parse --short HEAD)"
          if git diff --quiet -- index.html; then
            echo "Numbers unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "carrier-data-bot"
          git config user.email "carrier-data-bot@users.noreply.github.com"
          git commit -q -am "Status numbers from public $(git -C public rev-parse --short HEAD) on $(date -u +%F)"
          git push origin "HEAD:$REF_NAME"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the page
        if: ${{ steps.rewrite.outputs.changed == 'true' && github.ref_name == 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
